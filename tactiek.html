<!DOCTYPE html>
<html lang="nl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VFC Tactiekbord · KNVB Tactiek- & Speltypebord | Broadcast Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --bg-deep: #090D16;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-deep);
            background-image: 
                radial-gradient(circle at 50% 45%, rgba(16, 185, 129, 0.08) 0%, rgba(15, 23, 42, 0.4) 45%, #090D16 80%),
                radial-gradient(circle at 50% 0%, rgba(249, 115, 22, 0.07) 0%, transparent 50%);
            color: #f8fafc;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Glassmorphism Surfaces */
        .glass-bar {
            background: rgba(15, 23, 42, 0.72);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.65), 0 0 1px 1px rgba(255, 255, 255, 0.04) inset;
        }
        .glass-card {
            background: rgba(15, 23, 42, 0.68);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.09);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }
        /* Pill states */
        .format-pill-active {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #ffffff !important;
            box-shadow: 0 4px 15px -2px rgba(249, 115, 22, 0.45);
        }
        .scenario-pill-active {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff !important;
            border-color: rgba(249, 115, 22, 0.55) !important;
            box-shadow: 0 0 15px -3px rgba(249, 115, 22, 0.25);
        }
        .icon-toggle-active {
            background: rgba(56, 189, 248, 0.16) !important;
            color: #38bdf8 !important;
            border-color: rgba(56, 189, 248, 0.4) !important;
        }
        .tool-pill-active {
            background: linear-gradient(135deg, #3b82f6 0%, #2563eb 100%) !important;
            color: #ffffff !important;
            box-shadow: 0 4px 12px -2px rgba(59, 130, 246, 0.45);
        }
        /* Hide scrollbars inside pills */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        /* Smooth UI transitions for Focus Mode */
        .ui-panel {
            transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1), transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }
        body.focus-mode .ui-hide-on-focus {
            opacity: 0;
            pointer-events: none;
            transform: translateY(-12px);
        }
        body.focus-mode .ui-hide-bottom-on-focus {
            opacity: 0;
            pointer-events: none;
            transform: translateY(16px);
        }
        canvas {
            touch-action: none;
        }
    </style>
</head>
<body class="h-screen w-screen relative flex flex-col justify-between select-none">

    <!-- ==================== 1. BOVENBALK (COMPACT & STRAK GLASSMORPHISM) ==================== -->
    <header class="ui-panel ui-hide-on-focus relative z-30 pt-3 px-3 sm:px-6 flex items-center justify-center pointer-events-none">
        <div class="glass-bar rounded-2xl px-2.5 py-2 flex flex-wrap lg:flex-nowrap items-center justify-between gap-2 sm:gap-4 max-w-[1540px] w-full pointer-events-auto">
            
            <!-- Links: Brand + Segmented Pill Selector voor KNVB-wedstrijdvormen -->
            <div class="flex items-center gap-2.5 overflow-x-auto no-scrollbar">
                <div class="flex items-center gap-2 pl-1 pr-2 border-r border-slate-700/70 shrink-0">
                    <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-orange-500 to-amber-600 flex items-center justify-center shadow-md shadow-orange-500/20">
                        <i class="fa-solid fa-futbol text-white text-sm"></i>
                    </div>
                    <div class="hidden xl:block">
                        <div class="text-xs font-extrabold tracking-tight text-white leading-none">TACTIEKBORD</div>
                        <div class="text-[10px] text-slate-400 font-medium mt-0.5">KNVB Spelvormen</div>
                    </div>
                </div>

                <!-- Segmented Pill Selector: 4v4, 6v6, 8v8, 11v11, Rondo -->
                <div class="flex items-center bg-slate-950/60 p-1 rounded-xl border border-white/5 shrink-0" id="formatTabs">
                    <button onclick="selectFormat('4v4')" data-format="4v4" class="format-tab px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
                        <span>4v4</span>
                        <span class="hidden sm:inline text-[10px] opacity-70 font-normal">JO7</span>
                    </button>
                    <button onclick="selectFormat('6v6')" data-format="6v6" class="format-tab format-pill-active px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
                        <span>6v6</span>
                        <span class="hidden sm:inline text-[10px] opacity-85 font-normal">JO8-10</span>
                    </button>
                    <button onclick="selectFormat('8v8')" data-format="8v8" class="format-tab px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
                        <span>8v8</span>
                        <span class="hidden sm:inline text-[10px] opacity-70 font-normal">JO11-12</span>
                    </button>
                    <button onclick="selectFormat('11v11')" data-format="11v11" class="format-tab px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
                        <span>11v11</span>
                        <span class="hidden sm:inline text-[10px] opacity-70 font-normal">JO13+</span>
                    </button>
                    <button onclick="selectFormat('training')" data-format="training" class="format-tab px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition-all flex items-center gap-1.5">
                        <i class="fa-solid fa-arrows-spin text-[10px] text-amber-400"></i>
                        <span>Rondo / Positiespel</span>
                    </button>
                </div>
            </div>

            <!-- Midden: Speltype Pill-kiezer + Sub-formatie Dropdown -->
            <div class="flex items-center gap-1.5 overflow-x-auto no-scrollbar py-0.5">
                <div class="flex items-center gap-1 bg-slate-950/50 p-1 rounded-xl border border-white/5" id="scenarioButtons">
                    <button onclick="selectScenario('opbouw')" data-scenario="opbouw" class="scenario-btn scenario-pill-active px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white border border-transparent transition-all flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-share-nodes text-emerald-400 text-[11px]"></i>
                        <span>Opbouw</span>
                    </button>
                    <button onclick="selectScenario('aanval')" data-scenario="aanval" class="scenario-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white border border-transparent transition-all flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-bolt text-orange-400 text-[11px]"></i>
                        <span>Vleugelaanval & Voorzet</span>
                    </button>
                    <button onclick="selectScenario('omschakeling')" data-scenario="omschakeling" class="scenario-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white border border-transparent transition-all flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-shield-halved text-rose-400 text-[11px]"></i>
                        <span>Druk & Kantelen</span>
                    </button>
                    <button onclick="selectScenario('spelhervatting')" data-scenario="spelhervatting" class="scenario-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white border border-transparent transition-all flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-flag text-sky-400 text-[11px]"></i>
                        <span>Spelhervatting</span>
                    </button>
                    <button onclick="selectScenario('formatie')" data-scenario="formatie" class="scenario-btn px-2.5 py-1.5 rounded-lg text-xs font-medium text-slate-300 hover:text-white border border-transparent transition-all flex items-center gap-1.5 shrink-0">
                        <i class="fa-solid fa-chess-board text-purple-400 text-[11px]"></i>
                        <span>Basisformaties</span>
                    </button>
                </div>

                <!-- Sub-selector voor specifieke Formatie of Rondo-variant -->
                <div id="subFormationPanel" class="shrink-0">
                    <select id="formationSelect" onchange="changeSubFormation(this.value)" class="bg-slate-900/90 hover:bg-slate-800 border border-orange-500/40 rounded-xl px-2.5 py-1.5 text-xs text-orange-300 font-semibold focus:outline-none focus:border-orange-400 cursor-pointer transition">
                    </select>
                </div>
            </div>

            <!-- Rechts: Subtiele Icon-toggles voor Weergave & Focus-modus -->
            <div class="flex items-center gap-1.5 shrink-0 ml-auto lg:ml-0">
                <button id="btnTogglePaths" onclick="toggleVisualOption('paths')" class="icon-toggle-active w-8 h-8 rounded-xl bg-slate-900/70 hover:bg-slate-800 text-slate-400 border border-white/10 flex items-center justify-center transition" title="Looppaden & Passlijnen tonen/verbergen">
                    <i class="fa-solid fa-route text-xs"></i>
                </button>
                <button id="btnToggleTriangles" onclick="toggleVisualOption('triangles')" class="icon-toggle-active w-8 h-8 rounded-xl bg-slate-900/70 hover:bg-slate-800 text-slate-400 border border-white/10 flex items-center justify-center transition" title="Speeldriehoeken & Zones tonen/verbergen">
                    <i class="fa-solid fa-draw-polygon text-xs"></i>
                </button>
                <button id="btnToggleNames" onclick="toggleVisualOption('names')" class="icon-toggle-active w-8 h-8 rounded-xl bg-slate-900/70 hover:bg-slate-800 text-slate-400 border border-white/10 flex items-center justify-center transition" title="Spelersnamen & Rollen tonen/verbergen">
                    <i class="fa-solid fa-tag text-xs"></i>
                </button>
                <button id="btnToggleOpponents" onclick="toggleVisualOption('opponents')" class="icon-toggle-active w-8 h-8 rounded-xl bg-slate-900/70 hover:bg-slate-800 text-slate-400 border border-white/10 flex items-center justify-center transition" title="Tegenstander (Blauw) tonen/verbergen">
                    <i class="fa-solid fa-user-group text-xs"></i>
                </button>
                <div class="w-px h-5 bg-white/10 mx-0.5"></div>
                <button onclick="toggleOrientation()" class="w-8 h-8 rounded-xl bg-slate-900/70 hover:bg-slate-800 text-slate-300 border border-white/10 flex items-center justify-center transition" title="Draai Speelveld (Horizontaal / Verticaal)">
                    <i class="fa-solid fa-rotate text-xs text-orange-400"></i>
                </button>
                <button onclick="toggleFocusMode()" class="px-2.5 h-8 rounded-xl bg-slate-900/70 hover:bg-slate-800 text-slate-300 border border-white/10 flex items-center gap-1.5 text-xs font-medium transition" title="Focus-modus (Minimaliseer alle panelen)">
                    <i class="fa-solid fa-expand text-xs text-emerald-400"></i>
                    <span class="hidden xl:inline">Focus</span>
                </button>
            </div>

        </div>
    </header>

    <!-- Zwevende knop om Focus-modus te verlaten (alleen zichtbaar in Focus-modus) -->
    <div id="focusExitBar" class="fixed top-4 right-5 z-50 hidden items-center gap-2">
        <button onclick="togglePlay()" class="glass-bar px-3.5 py-2 rounded-xl text-xs font-bold text-white hover:bg-slate-800/80 flex items-center gap-2 transition">
            <i class="fa-solid fa-play text-orange-400" id="focusPlayIcon"></i>
            <span id="focusPhaseLabel">Fase 1/4</span>
        </button>
        <button onclick="toggleFocusMode()" class="glass-bar px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-200 hover:text-white flex items-center gap-2 border border-orange-500/40 transition">
            <i class="fa-solid fa-compress text-orange-400"></i>
            <span>Toon Bediening</span>
        </button>
    </div>

    <!-- ==================== 2. HET SPEELVELD (HERO CANVAS MET ADEMRUIMTE) ==================== -->
    <main class="flex-1 relative w-full h-full flex items-center justify-center overflow-hidden px-3 sm:px-8 py-2">
        
        <div id="canvasWrapper" class="w-full h-full flex items-center justify-center relative">
            <canvas id="pitchCanvas" class="cursor-grab active:cursor-grabbing"></canvas>
        </div>

        <!-- Zwevende Coaching-kaart (Rechtsboven / Linksonder, inklapbaar & minimalistisch) -->
        <aside id="coachingCard" class="ui-panel ui-hide-on-focus fixed left-4 sm:left-6 bottom-24 z-20 max-w-xs sm:max-w-sm w-full pointer-events-auto transition-all duration-300">
            <div class="glass-card rounded-2xl p-3.5 text-slate-100">
                <div class="flex items-center justify-between gap-2">
                    <div class="flex items-center gap-2">
                        <span class="px-2 py-0.5 text-[10px] font-extrabold uppercase tracking-wider rounded-md bg-orange-500/20 text-orange-400 border border-orange-500/30" id="coachStepBadge">FASE 1 / 4</span>
                        <span id="activeFormatBadge" class="text-[11px] font-semibold text-slate-400">6v6 • JO8-JO10</span>
                    </div>
                    <div class="flex items-center gap-1">
                        <button onclick="openEditPhaseTextModal()" class="w-6 h-6 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition" title="Bewerk coaching-tekst">
                            <i class="fa-solid fa-pen text-[10px]"></i>
                        </button>
                        <button onclick="toggleCoachCardCollapse()" class="w-6 h-6 rounded-lg hover:bg-white/10 text-slate-400 hover:text-white flex items-center justify-center transition" title="Kaart inklappen/uitklappen">
                            <i class="fa-solid fa-chevron-down text-xs" id="coachCollapseIcon"></i>
                        </button>
                    </div>
                </div>

                <h3 class="font-bold text-sm text-white mt-1.5 leading-snug" id="coachStepTitle">Keeper kiest positie & achterhoede maakt breed</h3>

                <div id="coachCardBody" class="mt-1.5 space-y-2 overflow-hidden transition-all">
                    <p class="text-xs text-slate-300/95 leading-relaxed" id="coachStepDesc">
                        De verdedigers zakken breed uit naar de zijkanten en de middenvelders bewegen in de passhoeken.
                    </p>
                    <div class="pt-2 border-t border-white/10 flex items-start gap-2 text-[11px] text-emerald-300/95">
                        <i class="fa-solid fa-lightbulb mt-0.5 text-emerald-400 shrink-0"></i>
                        <span id="coachStepTip" class="italic">"Open aannemen zodat je direct vooruit kunt spelen."</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Subtiele Zwevende Speler-Editor Popover (verschijnt rechtsboven wanneer je een speler aanklikt & wilt hernoemen) -->
        <div id="playerPopover" class="ui-panel ui-hide-on-focus fixed right-4 sm:right-6 bottom-24 z-20 hidden pointer-events-auto">
            <div class="glass-card rounded-2xl p-3 w-64">
                <div class="flex items-center justify-between mb-2">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-orange-400" id="selPlayerTeamBadge">Speler Aanpassen</span>
                    <button onclick="closePlayerPopover()" class="text-slate-400 hover:text-white text-xs">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                <div class="grid grid-cols-3 gap-1.5">
                    <div>
                        <label class="block text-[9px] uppercase text-slate-400 mb-0.5">Code/Nr</label>
                        <input type="text" id="inputPlayerRole" maxlength="3" oninput="savePlayerEdit()" class="w-full bg-slate-900/90 border border-white/15 rounded-lg px-2 py-1 text-xs font-bold text-white uppercase focus:outline-none focus:border-orange-500">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-[9px] uppercase text-slate-400 mb-0.5">Naam / Positie</label>
                        <input type="text" id="inputPlayerName" maxlength="16" oninput="savePlayerEdit()" class="w-full bg-slate-900/90 border border-white/15 rounded-lg px-2 py-1 text-xs text-white focus:outline-none focus:border-orange-500">
                    </div>
                </div>
            </div>
        </div>

    </main>

    <!-- ==================== 3. ONDERBALK (MEDIA-SPELER & MINIMALISTISCHE TEKENTOOLBAR) ==================== -->
    <footer class="ui-panel ui-hide-bottom-on-focus relative z-30 pb-3 px-3 sm:px-6 flex items-center justify-center pointer-events-none">
        <div class="glass-bar rounded-2xl px-3 py-2 flex flex-wrap lg:flex-nowrap items-center justify-between gap-3 max-w-[1360px] w-full pointer-events-auto">
            
            <!-- Links: Afspeelknoppen (Vorige, Play/Pauze, Volgende) -->
            <div class="flex items-center gap-1.5 shrink-0">
                <button onclick="prevPhase()" class="w-8 h-8 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 hover:text-white border border-white/10 flex items-center justify-center transition" title="Vorige fase">
                    <i class="fa-solid fa-backward-step text-xs"></i>
                </button>
                <button onclick="togglePlay()" id="btnPlayPause" class="px-4 h-9 rounded-xl bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-400 hover:to-amber-400 text-white font-bold text-xs shadow-lg shadow-orange-500/25 flex items-center gap-2 transition">
                    <i class="fa-solid fa-play text-xs" id="iconPlayPause"></i>
                    <span id="textPlayPause">Afspelen</span>
                </button>
                <button onclick="nextPhase()" class="w-8 h-8 rounded-xl bg-slate-900/80 hover:bg-slate-800 text-slate-300 hover:text-white border border-white/10 flex items-center justify-center transition" title="Volgende fase">
                    <i class="fa-solid fa-forward-step text-xs"></i>
                </button>
            </div>

            <!-- Midden: Visuele Fase-bolletjes & Vloeiende Voortgangslijn + Snelheid & +Fase -->
            <div class="flex-1 flex items-center gap-3 min-w-[240px]">
                <!-- Interactive Phase Nodes & Progress Track -->
                <div class="flex-1 flex flex-col gap-1">
                    <div class="flex items-center justify-between gap-1" id="phasePillsContainer">
                        <!-- Wordt dynamisch gevuld met fase-bolletjes -->
                    </div>
                    <!-- Scrubber Bar -->
                    <div class="w-full h-1.5 bg-slate-950/90 rounded-full overflow-hidden cursor-pointer relative border border-white/5" id="timelineTrack" onclick="scrubTimeline(event)">
                        <div id="timelineFill" class="h-full bg-gradient-to-r from-orange-500 via-amber-400 to-emerald-400 rounded-full transition-all duration-75" style="width: 25%"></div>
                    </div>
                </div>

                <!-- Snelheid (0.5x, 1x, 1.5x) & Loop -->
                <div class="hidden sm:flex items-center bg-slate-950/60 p-0.5 rounded-xl border border-white/5 text-[11px] shrink-0">
                    <button onclick="setSpeed(0.5)" data-speed="0.5" class="speed-btn px-2 py-1 rounded-lg text-slate-400 hover:text-white transition">0.5x</button>
                    <button onclick="setSpeed(1)" data-speed="1" class="speed-btn px-2 py-1 rounded-lg bg-white/15 text-white font-bold transition">1x</button>
                    <button onclick="setSpeed(1.5)" data-speed="1.5" class="speed-btn px-2 py-1 rounded-lg text-slate-400 hover:text-white transition">1.5x</button>
                </div>

                <button onclick="toggleLoop()" id="btnLoop" class="w-8 h-8 rounded-xl bg-orange-500/20 text-orange-400 border border-orange-500/40 text-xs flex items-center justify-center shrink-0 transition" title="Continu herhalen aan/uit">
                    <i class="fa-solid fa-repeat text-xs"></i>
                </button>

                <!-- Eigen Fase Toevoegen / Verwijderen / Reset -->
                <div class="flex items-center gap-1 shrink-0">
                    <button onclick="addCustomPhase()" class="px-2.5 h-8 rounded-xl text-xs font-bold bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 border border-emerald-500/40 transition flex items-center gap-1" title="Leg huidige posities vast als een nieuwe animatie-fase">
                        <i class="fa-solid fa-plus text-[10px]"></i>
                        <span>Fase</span>
                    </button>
                    <button onclick="deleteCurrentPhase()" id="btnDeletePhase" class="w-8 h-8 rounded-xl bg-slate-900/70 hover:bg-rose-950/60 text-slate-400 hover:text-rose-300 border border-white/10 transition flex items-center justify-center" title="Verwijder huidige fase">
                        <i class="fa-solid fa-trash-can text-[11px]"></i>
                    </button>
                    <button onclick="resetCurrentScenario()" class="w-8 h-8 rounded-xl bg-slate-900/70 hover:bg-slate-800 text-slate-400 hover:text-white border border-white/10 transition flex items-center justify-center" title="Herstel standaard posities">
                        <i class="fa-solid fa-rotate-left text-[11px]"></i>
                    </button>
                </div>
            </div>

            <!-- Rechts: Minimalistische Teken- & Interactietoolbar -->
            <div class="flex items-center gap-1 bg-slate-950/60 p-1 rounded-xl border border-white/5 shrink-0">
                <button onclick="setInteractionTool('move')" id="toolMove" class="tool-btn tool-pill-active px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1.5" title="Verplaatsen (Versleep spelers en bal, dubbelklik op speler voor naam)">
                    <i class="fa-solid fa-hand text-[11px]"></i>
                    <span class="hidden md:inline">Verplaatsen</span>
                </button>
                <button onclick="setInteractionTool('pass')" id="toolPass" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1.5" title="Teken Passlijn (Stippellijn)">
                    <i class="fa-solid fa-location-arrow text-amber-400 text-[11px]"></i>
                    <span class="hidden md:inline">Passlijn</span>
                </button>
                <button onclick="setInteractionTool('run')" id="toolRun" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1.5" title="Teken Looplijn (Gebogen pijl)">
                    <i class="fa-solid fa-bezier-curve text-sky-400 text-[11px]"></i>
                    <span class="hidden md:inline">Looplijn</span>
                </button>
                <button onclick="setInteractionTool('zone')" id="toolZone" class="tool-btn px-2.5 py-1.5 rounded-lg text-xs font-semibold text-slate-300 hover:text-white transition flex items-center gap-1.5" title="Ruimte / Zone markeren op het gras">
                    <i class="fa-regular fa-circle-dot text-emerald-400 text-[11px]"></i>
                    <span class="hidden md:inline">Zone</span>
                </button>
                <button onclick="clearDrawings()" class="px-2 py-1.5 rounded-lg text-xs font-semibold text-rose-400 hover:bg-rose-500/15 transition flex items-center justify-center" title="Wis getekende lijnen en zones">
                    <i class="fa-solid fa-eraser text-xs"></i>
                </button>
            </div>

        </div>
    </footer>

    <!-- Modal voor het aanpassen van Fase-titel & Uitleg -->
    <div id="editPhaseModal" class="fixed inset-0 bg-black/75 backdrop-blur-md z-50 hidden items-center justify-center p-4">

        </div>
    </div>

    <script>

        function buildScenarioData(format, scenarioKey, subIdx = 0) {
            if (format === 'training') return buildTrainingScenario(scenarioKey, subIdx);
            if (format === '4v4') return build4v4Scenario(scenarioKey, subIdx);
            if (format === '6v6') return build6v6Scenario(scenarioKey, subIdx);
            if (format === '8v8') return build8v8Scenario(scenarioKey, subIdx);
            return build11v11Scenario(scenarioKey, subIdx);
        }

        /* -------------------- 4 TEGEN 4 (JO7 MINI-PUPILLEN) -------------------- */

            return createStructuredScenario(homeRoles, awayRoles, neutralRoles, [

                {

                {

                    desc: 'LV bereikt de kopspeler (N1) aan de overzijde van het vak. Het positiespel kantelt direct voor de terugweg.',
                    tip: '"Scoor punten door gecontroleerd van de ene kopspeler naar de andere kopspeler te spelen!"',
                    ball: { x: 0.76, y: 0.66 },

                    neutral: [[0.76, 0.66], [0.52, 0.48]],

                }
