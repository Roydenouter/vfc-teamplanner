        }

        function buildFormationMovementScenario(homeRoles, awayRoles, baseHomeCoords, formationName) {
            const baseAwayCoords = baseHomeCoords.map(([x, y]) => [1 - x, 1 - y]);

            const shiftCoords = (coords, dx, dy, compressY = 1.0) => {
                return coords.map(([x, y], idx) => {
                    if (idx === 0 && homeRoles[0][0] === 'K') {
                        return [Math.min(0.14, Math.max(0.04, x + dx * 0.3)), Math.min(0.62, Math.max(0.38, y + dy * 0.25))];
                    }
                    let nx = Math.min(0.92, Math.max(0.08, x + dx));
                    let ny = 0.5 + (y - 0.5) * compressY + dy;
                    ny = Math.min(0.93, Math.max(0.07, ny));
                    return [nx, ny];
                });
            };

            const autoTriangles = computeDelaunayLikeTriangles(baseHomeCoords);

            return createStructuredScenario(homeRoles, awayRoles, [], [
                {
                    title: `Fase 1: Basisformatie ${formationName} (Centrum)`,
                    desc: `Standaard veldbezetting in ${formationName}. Let op de onderlinge afstanden en natuurlijke speeldriehoeken.`,
                    tip: `"Zorg dat je nooit op exact dezelfde lijn staat als je directe buurman."`,
                    ball: { x: baseHomeCoords[0][0] + 0.02, y: baseHomeCoords[0][1] },
                    home: baseHomeCoords,
                    away: baseAwayCoords,
                    triangles: autoTriangles
                },
                {
                    title: `Fase 2: ${formationName} – Kantelen naar Links`,
                    desc: 'De bal is op de linkerflank. Het hele team schuift als één harmonica mee naar links en knijpt rechts naar binnen.',
                    tip: '"Als de bal links is, sluit de rechterkant tot aan de as van het veld aan!"',
                    ball: { x: 0.45, y: 0.16 },
                    home: shiftCoords(baseHomeCoords, 0.06, -0.14, 0.82),
                    away: shiftCoords(baseAwayCoords, -0.05, -0.10, 0.85),
                    triangles: autoTriangles
                },
                {
                    title: `Fase 3: ${formationName} – Kantelen naar Rechts`,
                    desc: 'Het spel wordt verlegd naar de rechtervleugel. Alle linies kantelen synchroon mee om de driehoeken te bewaren.',
                    tip: '"Bewaar tijdens het kantelen de vaste onderlinge afstanden tussen de linies."',
                    ball: { x: 0.52, y: 0.84, arc: 0.55 },
                    home: shiftCoords(baseHomeCoords, 0.08, 0.14, 0.82),
                    away: shiftCoords(baseAwayCoords, -0.06, 0.10, 0.85),
                    triangles: autoTriangles
                },
                {
                    title: `Fase 4: ${formationName} – Hoog Aansluiten`,
                    desc: 'Bij druk op de helft van de tegenstander schuift de laatste linie mee op tot aan de middenlijn.',
                    tip: '"Hoog aansluiten houdt het veld klein zodat afvallende ballen direct voor ons zijn!"',
                    ball: { x: 0.74, y: 0.50 },
                    home: shiftCoords(baseHomeCoords, 0.18, 0.0, 0.92),
                    away: shiftCoords(baseAwayCoords, 0.10, 0.0, 0.78),
                    triangles: autoTriangles
                }
            ]);
        }

        function computeDelaunayLikeTriangles(coords) {
            const tris = [];
            const n = coords.length;
            if (n < 3) return tris;
            for (let i = 0; i < n; i++) {
                const dists = [];
                for (let j = 0; j < n; j++) {
                    if (i === j) continue;
                    dists.push({ idx: j, d: Math.hypot(coords[i][0] - coords[j][0], coords[i][1] - coords[j][1]) });
                }
                dists.sort((a, b) => a.d - b.d);
                if (dists.length >= 2) {
                    const tri = [i, dists[0].idx, dists[1].idx].sort((a, b) => a - b);
                    const key = tri.join('-');
                    if (!tris.some(t => t.join('-') === key)) tris.push(tri);
                }
            }
            return tris.slice(0, 5);
        }

        function createStructuredScenario(homeRoles, awayRoles, neutralRoles, phasesRaw) {
            return {
                homePlayers: homeRoles.map(([role, name]) => ({ role, name })),
                awayPlayers: awayRoles.map(([role, name]) => ({ role, name })),
                neutralPlayers: (neutralRoles || []).map(([role, name]) => ({ role, name })),
                phases: phasesRaw.map(p => ({
                    title: p.title,
                    desc: p.desc,
                    tip: p.tip,
                    ball: { x: p.ball.x, y: p.ball.y, arc: p.ball.arc || 0 },
                    home: p.home.map(([x, y]) => ({ x, y })),
                    away: p.away.map(([x, y]) => ({ x, y })),
                    neutral: (p.neutral || []).map(([x, y]) => ({ x, y })),
                    triangles: p.triangles || []
                }))
            };
        }

        /**************************************************************************
         * 3. COORDINATE TRANSFORMATION & GRASS TEXTURE GENERATOR
         **************************************************************************/
        function createGrassNoisePattern() {
            const c = document.createElement('canvas');
            c.width = 96;
            c.height = 96;
            const gctx = c.getContext('2d');
            for (let y = 0; y < 96; y += 2) {
                for (let x = 0; x < 96; x += 2) {
                    const v = Math.random();
                    if (v > 0.62) {
                        gctx.fillStyle = 'rgba(255, 255, 255, 0.018)';
                        gctx.fillRect(x, y, 2, 2);
                    } else if (v < 0.25) {
                        gctx.fillStyle = 'rgba(0, 0, 0, 0.025)';
                        gctx.fillRect(x, y, 2, 2);
                    }
                }
            }
            grassPatternCanvas = c;
        }

        function logicalToCanvas(lx, ly) {
            if (!isVertical) {
                return {
                    x: pitchRect.left + lx * pitchRect.width,
                    y: pitchRect.top + ly * pitchRect.height
                };
            } else {
                return {
                    x: pitchRect.left + ly * pitchRect.width,
                    y: pitchRect.top + (1 - lx) * pitchRect.height
                };
            }
        }

        function canvasToLogical(cx, cy) {
            if (!isVertical) {
                return {
                    x: Math.min(0.99, Math.max(0.01, (cx - pitchRect.left) / pitchRect.width)),
                    y: Math.min(0.99, Math.max(0.01, (cy - pitchRect.top) / pitchRect.height))
                };
            } else {
                return {
                    x: Math.min(0.99, Math.max(0.01, 1 - (cy - pitchRect.top) / pitchRect.height)),
                    y: Math.min(0.99, Math.max(0.01, (cx - pitchRect.left) / pitchRect.width))
                };
            }
        }

        /**************************************************************************
         * 4. PHOTOREALISTIC BROADCAST PITCH & 3D GOALS RENDERER
         **************************************************************************/
        function resizeCanvas() {
            const wrapper = document.getElementById('canvasWrapper');
            const availW = Math.max(320, wrapper.clientWidth);
            const availH = Math.max(280, wrapper.clientHeight);
            const dpr = window.devicePixelRatio || 1;

            let aspect = isVertical ? 0.68 : 1.56;
            if (currentFormat === 'training') {
                aspect = isVertical ? 0.85 : 1.32;
            }

            let cssWidth = availW;
            let cssHeight = Math.round(cssWidth / aspect);

            if (cssHeight > availH) {
                cssHeight = availH;
                cssWidth = Math.round(cssHeight * aspect);
            }

            canvas.style.width = cssWidth + 'px';
            canvas.style.height = cssHeight + 'px';
            canvas.width = Math.round(cssWidth * dpr);
            canvas.height = Math.round(cssHeight * dpr);

            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

            const margin = Math.max(28, Math.round(Math.min(cssWidth, cssHeight) * 0.068));
            pitchRect = {
                left: margin,
                top: margin,
                width: cssWidth - margin * 2,
                height: cssHeight - margin * 2,
                cssWidth,
                cssHeight
            };

            drawScene();
        }

        function drawPitchBackground() {
            const { left, top, width, height, cssWidth, cssHeight } = pitchRect;

            ctx.clearRect(0, 0, cssWidth, cssHeight);

            // 1. Luxury 3D Stadium Board Base with rounded corners & shadow
            ctx.save();
            const boardPad = Math.max(18, Math.min(left, top) * 0.72);
            const bx = left - boardPad;
            const by = top - boardPad;
            const bw = width + boardPad * 2;
            const bh = height + boardPad * 2;

            ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
            ctx.shadowBlur = 35;
            ctx.shadowOffsetY = 16;

            // Dark metallic stadium surround
            const boardGrad = ctx.createLinearGradient(bx, by, bx, by + bh);
            boardGrad.addColorStop(0, '#0f291e');
            boardGrad.addColorStop(1, '#071710');
            ctx.fillStyle = boardGrad;
            ctx.beginPath();
            ctx.roundRect(bx, by, bw, bh, 22);
            ctx.fill();

            // Subtle 3D rim border around the tactical board
            ctx.shadowColor = 'transparent';
            ctx.lineWidth = 1.5;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
            ctx.stroke();
            ctx.restore();

            // 2. Clip inner turf & draw alternating emerald mowed grass bands
            ctx.save();
            ctx.beginPath();
            ctx.roundRect(left - 6, top - 6, width + 12, height + 12, 10);
            ctx.clip();

            const numStripes = currentFormat === '11v11' ? 14 : (currentFormat === '8v8' ? 10 : 8);
            for (let i = 0; i < numStripes; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#136f3a' : '#0f5c30';
                if (!isVertical) {
                    const sw = width / numStripes;
                    ctx.fillRect(left + i * sw, top - 6, sw + 0.6, height + 12);
                } else {
                    const sh = height / numStripes;
                    ctx.fillRect(left - 6, top + i * sh, width + 12, sh + 0.6);
                }
            }

            // Cross-cut subtle mowing sheen
            const crossStripes = 6;
            for (let j = 0; j < crossStripes; j++) {
                ctx.fillStyle = j % 2 === 0 ? 'rgba(255, 255, 255, 0.015)' : 'rgba(0, 0, 0, 0.015)';
                if (!isVertical) {
                    const ch = height / crossStripes;
                    ctx.fillRect(left - 6, top + j * ch, width + 12, ch);
                } else {
                    const cw = width / crossStripes;
                    ctx.fillRect(left + j * cw, top - 6, cw, height + 12);
                }
            }

            // Fine grass micro-texture
            if (grassPatternCanvas) {
                const pat = ctx.createPattern(grassPatternCanvas, 'repeat');
                ctx.fillStyle = pat;
                ctx.fillRect(left - 6, top - 6, width + 12, height + 12);
            }

            // Stadium Floodlight Radial Illumination
            const lightGrad = ctx.createRadialGradient(
                left + width * 0.5, top + height * 0.5, Math.min(width, height) * 0.08,
                left + width * 0.5, top + height * 0.5, Math.max(width, height) * 0.78
            );
            lightGrad.addColorStop(0, 'rgba(134, 239, 172, 0.11)');
            lightGrad.addColorStop(0.55, 'rgba(16, 185, 129, 0.02)');
            lightGrad.addColorStop(1, 'rgba(0, 0, 0, 0.28)');
            ctx.fillStyle = lightGrad;
            ctx.fillRect(left - 6, top - 6, width + 12, height + 12);
            ctx.restore();

            // 3. Crisp Chalk Lines with subtle broadcast glow
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)';
            ctx.lineWidth = 2.0;
            ctx.lineJoin = 'round';
            ctx.shadowColor = 'rgba(255, 255, 255, 0.25)';
            ctx.shadowBlur = 4;

            // Outer touchline & goal lines
            ctx.strokeRect(left, top, width, height);

            if (currentFormat === 'training') {
                ctx.restore();
                drawTrainingPitchMarkings();
                return;
            }

            // Halfway line
            ctx.beginPath();
            if (!isVertical) {
                ctx.moveTo(left + width / 2, top);
                ctx.lineTo(left + width / 2, top + height);
            } else {
                ctx.moveTo(left, top + height / 2);
                ctx.lineTo(left + width, top + height / 2);
            }
            ctx.stroke();

            // Center circle & spot
            const centerRadius = Math.min(width, height) * (currentFormat === '4v4' ? 0.12 : 0.155);
            ctx.beginPath();
            ctx.arc(left + width / 2, top + height / 2, centerRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(left + width / 2, top + height / 2, 3.2, 0, Math.PI * 2);
            ctx.fill();

            // Format-specific boxes, arcs, spots, 3D goals & 3D cones
            if (currentFormat === '4v4') {
                ctx.restore();
                draw3DGoal(0, 0.42, 0.58, 0.032);
                draw3DGoal(1, 0.42, 0.58, 0.032);
                draw3DCones([[0, 0], [0, 1], [1, 0], [1, 1], [0.5, 0], [0.5, 1]]);
            } else if (currentFormat === '6v6') {
                drawBox(0, 0.14, 0.24, 0.76);
                drawBox(1, 0.14, 0.24, 0.76);
                ctx.restore();
                draw3DGoal(0, 0.37, 0.63, 0.036);
                draw3DGoal(1, 0.37, 0.63, 0.036);
                draw3DCones([[0.5, 0], [0.5, 1]]);
            } else if (currentFormat === '8v8') {
                drawBox(0, 0.16, 0.20, 0.80);
                drawBox(1, 0.16, 0.20, 0.80);
                drawSpot(0.11, 0.50);
                drawSpot(0.89, 0.50);
                ctx.restore();
                draw3DGoal(0, 0.36, 0.64, 0.038);
                draw3DGoal(1, 0.36, 0.64, 0.038);
            } else if (currentFormat === '11v11') {
                drawBox(0, 0.165, 0.19, 0.81);
                drawBox(1, 0.165, 0.19, 0.81);
                drawBox(0, 0.055, 0.36, 0.64);
                drawBox(1, 0.055, 0.36, 0.64);
                drawSpot(0.11, 0.50);
                drawSpot(0.89, 0.50);
                drawPenaltyArc(0);
                drawPenaltyArc(1);
                drawCornerArcs();
                ctx.restore();
                draw3DGoal(0, 0.41, 0.59, 0.038);
                draw3DGoal(1, 0.41, 0.59, 0.038);
            }
        }

        function drawTrainingPitchMarkings() {
            const p1 = logicalToCanvas(0.20, 0.14);
            const p2 = logicalToCanvas(0.80, 0.86);
            const minX = Math.min(p1.x, p2.x);
            const minY = Math.min(p1.y, p2.y);
            const w = Math.abs(p2.x - p1.x);
            const h = Math.abs(p2.y - p1.y);

            // Subtle training grid highlight
            ctx.save();
            ctx.fillStyle = 'rgba(255, 255, 255, 0.025)';
            ctx.fillRect(minX, minY, w, h);

            ctx.setLineDash([8, 6]);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.82)';
            ctx.lineWidth = 2.0;
            ctx.strokeRect(minX, minY, w, h);
            ctx.restore();

            draw3DCones([
                [0.20, 0.14], [0.80, 0.14], [0.80, 0.86], [0.20, 0.86],
                [0.50, 0.14], [0.50, 0.86], [0.20, 0.50], [0.80, 0.50]
            ]);
        }

        function draw3DCones(coordsList) {
            coordsList.forEach(([lx, ly]) => {
                const pt = logicalToCanvas(lx, ly);
                ctx.save();
                // Ground shadow
                ctx.fillStyle = 'rgba(0, 0, 0, 0.45)';
                ctx.beginPath();
                ctx.ellipse(pt.x + 1.5, pt.y + 2.5, 6.5, 4.5, 0, 0, Math.PI * 2);
                ctx.fill();

                // 3D Cone Base
                const coneGrad = ctx.createRadialGradient(pt.x - 1.5, pt.y - 1.5, 1, pt.x, pt.y, 6);
                coneGrad.addColorStop(0, '#fde047');
                coneGrad.addColorStop(0.55, '#f97316');
                coneGrad.addColorStop(1, '#c2410c');
                ctx.fillStyle = coneGrad;
                ctx.beginPath();
                ctx.arc(pt.x, pt.y, 5.8, 0, Math.PI * 2);
                ctx.fill();

                // Inner cone hole highlight
                ctx.fillStyle = '#fff7ed';
                ctx.beginPath();
                ctx.arc(pt.x - 0.5, pt.y - 0.5, 1.6, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });
        }

        /**
         * Draws a realistic 3D-looking football goal with turf shadow, net mesh & gleaming posts
         */
        function draw3DGoal(side, y1, y2, depthLogical) {
            const x0 = side === 0 ? 0 : 1;
            const x1 = side === 0 ? -depthLogical : 1 + depthLogical;
            const post1 = logicalToCanvas(x0, y1);
            const post2 = logicalToCanvas(x0, y2);
            const back1 = logicalToCanvas(x1, y1);
            const back2 = logicalToCanvas(x1, y2);

            const rx = Math.min(post1.x, back2.x);
            const ry = Math.min(post1.y, back2.y);
            const rw = Math.abs(back2.x - post1.x);
            const rh = Math.abs(back2.y - post1.y);

            ctx.save();

            // 1. Cast shadow on turf
            ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
            ctx.fillRect(rx + 2, ry + 3, rw, rh);

            // 2. Translucent net body
            ctx.fillStyle = 'rgba(241, 245, 249, 0.12)';
            ctx.fillRect(rx, ry, rw, rh);

            // 3. Fine hexagonal / crisscross mesh net lines
            ctx.save();
            ctx.beginPath();
            ctx.rect(rx, ry, rw, rh);
            ctx.clip();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.26)';
            ctx.lineWidth = 0.8;
            const step = 5;
            for (let d = -rh; d < rw + rh; d += step) {
                ctx.beginPath();
                ctx.moveTo(rx + d, ry);
                ctx.lineTo(rx + d - rh, ry + rh);
                ctx.moveTo(rx + d, ry);
                ctx.lineTo(rx + d + rh, ry + rh);
                ctx.stroke();
            }
            ctx.restore();

            // 4. Back net support frame (subtle dark silver)
            ctx.strokeStyle = 'rgba(203, 213, 225, 0.65)';
            ctx.lineWidth = 1.6;
            ctx.strokeRect(rx, ry, rw, rh);

            // 5. Gleaming white goalposts & crossbar on the goal line
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.2;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
            ctx.shadowBlur = 4;
            ctx.beginPath();
            ctx.moveTo(post1.x, post1.y);
            ctx.lineTo(post2.x, post2.y);
            ctx.stroke();

            // Goalpost caps
            [post1, post2].forEach(p => {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.arc(p.x, p.y, 3.2, 0, Math.PI * 2);
                ctx.fill();
            });

            ctx.restore();
        }

        function drawBox(side, depthX, minY, maxY) {
            const x0 = side === 0 ? 0 : 1;
            const x1 = side === 0 ? depthX : 1 - depthX;
            const a = logicalToCanvas(x0, minY);
            const b = logicalToCanvas(x1, maxY);
            ctx.strokeRect(Math.min(a.x, b.x), Math.min(a.y, b.y), Math.abs(b.x - a.x), Math.abs(b.y - a.y));
        }

        function drawSpot(lx, ly) {
            const pt = logicalToCanvas(lx, ly);
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawPenaltyArc(side) {
            const spot = logicalToCanvas(side === 0 ? 0.11 : 0.89, 0.50);
            const r = Math.min(pitchRect.width, pitchRect.height) * 0.11;
            ctx.beginPath();
            if (!isVertical) {
                if (side === 0) ctx.arc(spot.x, spot.y, r, -0.92, 0.92);
                else ctx.arc(spot.x, spot.y, r, Math.PI - 0.92, Math.PI + 0.92);
            } else {
                if (side === 0) ctx.arc(spot.x, spot.y, r, -Math.PI / 2 - 0.92, -Math.PI / 2 + 0.92);
                else ctx.arc(spot.x, spot.y, r, Math.PI / 2 - 0.92, Math.PI / 2 + 0.92);
            }
            ctx.stroke();
        }

        function drawCornerArcs() {
            const { left, top, width, height } = pitchRect;
            const r = 10;
            ctx.beginPath();
            ctx.arc(left, top, r, 0, Math.PI / 2);
            ctx.moveTo(left + width, top);
            ctx.arc(left + width, top, r, Math.PI / 2, Math.PI);
            ctx.moveTo(left + width, top + height);
            ctx.arc(left + width, top + height, r, Math.PI, Math.PI * 1.5);
            ctx.moveTo(left, top + height);
            ctx.arc(left, top + height, r, Math.PI * 1.5, Math.PI * 2);
            ctx.stroke();
        }

        /**************************************************************************
         * 5. INTERPOLATION, BÉZIER ARROWS, BROADCAST PUCKS & 3D BALL PHYSICS
         **************************************************************************/
        function easeInOutCubic(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Realistic ball deceleration: ball travels faster than players and rolls smoothly into feet
        function easeOutQuart(t) {
            return 1 - Math.pow(1 - Math.min(1, t * 1.18), 4);
        }

        function getInterpolatedState() {
            const phases = activeData.phases;
            const pA = phases[currentPhaseIndex];
            const nextIdx = (currentPhaseIndex + 1) % phases.length;
            const pB = (isPlaying && (currentPhaseIndex < phases.length - 1 || loopEnabled))
                ? phases[nextIdx]
                : pA;

            const tPlayer = easeInOutCubic(phaseProgress);
            const tBall = easeOutQuart(phaseProgress);

            const lerpPt = (a, b, t) => ({
                x: a.x + (b.x - a.x) * t,
                y: a.y + (b.y - a.y) * t
            });

            // Calculate 3D lofted ball height (parabolic arc 4 * h * t * (1 - t))
            const bDist = Math.hypot(pB.ball.x - pA.ball.x, pB.ball.y - pA.ball.y);
            const targetArc = pB.ball.arc || (bDist > 0.34 ? 0.55 : 0);
            const ballElevation = isPlaying && pA !== pB
                ? Math.sin(Math.min(1, phaseProgress * 1.15) * Math.PI) * targetArc
                : 0;

            return {
                pA,
                pB,
                ball: lerpPt(pA.ball, pB.ball, tBall),
                ballElevation,
                ballTravelDist: bDist * tBall,
                home: pA.home.map((pt, i) => lerpPt(pt, pB.home[i] || pt, tPlayer)),
                away: pA.away.map((pt, i) => lerpPt(pt, pB.away[i] || pt, tPlayer)),
                neutral: (pA.neutral || []).map((pt, i) => lerpPt(pt, (pB.neutral && pB.neutral[i]) || pt, tPlayer)),
                triangles: pA.triangles || []
            };
        }

        function drawScene() {
            if (!activeData) return;
            drawPitchBackground();

            const state = getInterpolatedState();
            const phases = activeData.phases;
            const currPhase = phases[currentPhaseIndex];
            const targetPhaseIdx = (currentPhaseIndex < phases.length - 1)
                ? currentPhaseIndex + 1
                : (phases.length > 1 ? 0 : currentPhaseIndex);
            const nextPhaseObj = phases[targetPhaseIdx];

            // 1. Draw Broadcast Tactical Polygons (Speeldriehoeken / Trechter met zachte glow)
            if (showTriangles && state.triangles && state.triangles.length > 0) {
                const isPressing = currentScenario === 'omschakeling';
                state.triangles.forEach(tri => {
                    const [i1, i2, i3] = tri;
                    if (!state.home[i1] || !state.home[i2] || !state.home[i3]) return;
                    const c1 = logicalToCanvas(state.home[i1].x, state.home[i1].y);
                    const c2 = logicalToCanvas(state.home[i2].x, state.home[i2].y);
                    const c3 = logicalToCanvas(state.home[i3].x, state.home[i3].y);

                    ctx.save();
                    ctx.beginPath();
                    ctx.moveTo(c1.x, c1.y);
                    ctx.lineTo(c2.x, c2.y);
                    ctx.lineTo(c3.x, c3.y);
                    ctx.closePath();

                    const cx = (c1.x + c2.x + c3.x) / 3;
                    const cy = (c1.y + c2.y + c3.y) / 3;
                    const polyGrad = ctx.createRadialGradient(cx, cy, 5, cx, cy, 130);
                    if (isPressing) {
                        polyGrad.addColorStop(0, 'rgba(244, 63, 94, 0.22)');
                        polyGrad.addColorStop(1, 'rgba(244, 63, 94, 0.05)');
                        ctx.strokeStyle = 'rgba(251, 113, 133, 0.48)';
                    } else {
                        polyGrad.addColorStop(0, 'rgba(52, 211, 153, 0.20)');
                        polyGrad.addColorStop(1, 'rgba(250, 204, 21, 0.06)');
                        ctx.strokeStyle = 'rgba(110, 231, 183, 0.45)';
                    }
                    ctx.fillStyle = polyGrad;
                    ctx.fill();

                    ctx.setLineDash([5, 5]);
                    ctx.lineDashOffset = -visualTick * 12;
                    ctx.lineWidth = 1.5;
                    ctx.stroke();
                    ctx.restore();
                });
            }

            // 2. Draw Curved Bézier Player Movement Arrows & Pass Trajectories
            if (showPaths && currPhase && nextPhaseObj && currPhase !== nextPhaseObj) {
                // Player Curved Run Lines
                currPhase.home.forEach((startPt, i) => {
                    const endPt = nextPhaseObj.home[i];
                    if (!endPt) return;
                    const dist = Math.hypot(endPt.x - startPt.x, endPt.y - startPt.y);
                    if (dist > 0.035) {
                        const cStart = logicalToCanvas(startPt.x, startPt.y);
                        const cEnd = logicalToCanvas(endPt.x, endPt.y);
                        drawCurvedArrow(cStart.x, cStart.y, cEnd.x, cEnd.y, 'rgba(56, 189, 248, 0.85)', true, 2.2, (i % 2 === 0 ? 1 : -1) * 0.14);
                    }
                });

                // Ball Pass Line
                const bStart = currPhase.ball;
                const bEnd = nextPhaseObj.ball;
                const bDist = Math.hypot(bEnd.x - bStart.x, bEnd.y - bStart.y);
                if (bDist > 0.03) {
                    const cStart = logicalToCanvas(bStart.x, bStart.y);
                    const cEnd = logicalToCanvas(bEnd.x, bEnd.y);
                    const curve = (nextPhaseObj.ball.arc || bDist > 0.34) ? -0.18 : 0;
                    drawCurvedArrow(cStart.x, cStart.y, cEnd.x, cEnd.y, '#fde047', false, 2.8, curve);
                }
            }

            // 3. Draw User Custom Drawings (Passlijnen, Gebogen Looplijnen, Zones)
            const allDrawings = [...customDrawings];
            if (currentDrawing) allDrawings.push(currentDrawing);
            allDrawings.forEach(d => {
                const c1 = logicalToCanvas(d.x1, d.y1);
                const c2 = logicalToCanvas(d.x2, d.y2);
                if (d.type === 'run') {
                    drawCurvedArrow(c1.x, c1.y, c2.x, c2.y, '#38bdf8', true, 2.8, 0.18);
                } else if (d.type === 'pass') {
                    drawCurvedArrow(c1.x, c1.y, c2.x, c2.y, '#facc15', true, 3.0, 0.0);
                } else if (d.type === 'zone') {
                    const r = Math.max(16, Math.hypot(c2.x - c1.x, c2.y - c1.y));
                    ctx.save();
                    const zGrad = ctx.createRadialGradient(c1.x, c1.y, 4, c1.x, c1.y, r);
                    zGrad.addColorStop(0, 'rgba(16, 185, 129, 0.30)');
                    zGrad.addColorStop(1, 'rgba(16, 185, 129, 0.06)');
                    ctx.beginPath();
                    ctx.arc(c1.x, c1.y, r, 0, Math.PI * 2);
                    ctx.fillStyle = zGrad;
                    ctx.fill();
                    ctx.setLineDash([6, 4]);
                    ctx.lineDashOffset = -visualTick * 15;
                    ctx.strokeStyle = '#34d399';
                    ctx.lineWidth = 2.0;
                    ctx.stroke();
                    ctx.restore();
                }
            });

            // 4. Draw Broadcast Player Pucks (3D layered with Directional Vision Arc)
            const puckRadius = getPlayerTokenRadius();
            const ballCanvas = logicalToCanvas(state.ball.x, state.ball.y);

            if (showOpponents) {
                state.away.forEach((pt, i) => {
                    const c = logicalToCanvas(pt.x, pt.y);
                    const nextPt = nextPhaseObj?.away?.[i] ? logicalToCanvas(nextPhaseObj.away[i].x, nextPhaseObj.away[i].y) : null;
                    const angle = getPlayerFacingAngle(c, nextPt, ballCanvas);
                    const info = activeData.awayPlayers[i] || { role: `${i + 1}`, name: '' };
                    const isSelected = (selectedPlayer && selectedPlayer.team === 'away' && selectedPlayer.index === i) ||
                                       (hoveredEntity && hoveredEntity.type === 'away' && hoveredEntity.index === i);
                    drawBroadcastPuck(c.x, c.y, puckRadius, 'away', info.role, info.name, angle, isSelected);
                });
            }

            state.neutral.forEach((pt, i) => {
                const c = logicalToCanvas(pt.x, pt.y);
                const nextPt = nextPhaseObj?.neutral?.[i] ? logicalToCanvas(nextPhaseObj.neutral[i].x, nextPhaseObj.neutral[i].y) : null;
                const angle = getPlayerFacingAngle(c, nextPt, ballCanvas);
                const info = activeData.neutralPlayers[i] || { role: `N${i + 1}`, name: 'Neutraal' };
                const isSelected = (selectedPlayer && selectedPlayer.team === 'neutral' && selectedPlayer.index === i) ||
                                   (hoveredEntity && hoveredEntity.type === 'neutral' && hoveredEntity.index === i);
                drawBroadcastPuck(c.x, c.y, puckRadius, 'neutral', info.role, info.name, angle, isSelected);
            });

            state.home.forEach((pt, i) => {
                const c = logicalToCanvas(pt.x, pt.y);
                const nextPt = nextPhaseObj?.home?.[i] ? logicalToCanvas(nextPhaseObj.home[i].x, nextPhaseObj.home[i].y) : null;
                const angle = getPlayerFacingAngle(c, nextPt, ballCanvas);
                const info = activeData.homePlayers[i] || { role: `${i + 1}`, name: '' };
                const palette = info.role === 'K' ? 'keeper' : 'home';
                const isSelected = (selectedPlayer && selectedPlayer.team === 'home' && selectedPlayer.index === i) ||
                                   (hoveredEntity && hoveredEntity.type === 'home' && hoveredEntity.index === i);
                drawBroadcastPuck(c.x, c.y, puckRadius, palette, info.role, info.name, angle, isSelected);
            });

            // 5. Draw Realistic Rotating 3D Football with Lofted Shadow Separation
            drawBroadcastFootball(ballCanvas.x, ballCanvas.y, Math.max(8.5, puckRadius * 0.60), state.ballElevation, state.ballTravelDist);
        }

        function getPlayerFacingAngle(currCanvas, nextCanvas, ballCanvas) {
            if (nextCanvas) {
                const d = Math.hypot(nextCanvas.x - currCanvas.x, nextCanvas.y - currCanvas.y);
                if (d > 14) {
                    return Math.atan2(nextCanvas.y - currCanvas.y, nextCanvas.x - currCanvas.x);
                }
            }
            return Math.atan2(ballCanvas.y - currCanvas.y, ballCanvas.x - currCanvas.x);
        }

        function getPlayerTokenRadius() {
            const minDim = Math.min(pitchRect.width, pitchRect.height);
            if (currentFormat === '11v11') return Math.max(12.5, Math.min(17.5, minDim * 0.034));
            if (currentFormat === '8v8') return Math.max(13.5, Math.min(19.5, minDim * 0.039));
            return Math.max(14.5, Math.min(21.5, minDim * 0.044));
        }

        /**
         * Draws a smooth Quadratic Bézier Arrow with animated marching dashes
         */
        function drawCurvedArrow(x1, y1, x2, y2, color, dashed, width, curvature = 0.15) {
            const dx = x2 - x1;
            const dy = y2 - y1;
            const len = Math.hypot(dx, dy);
            if (len < 12) return;

            // Shorten endpoint slightly so arrowhead sits cleanly outside target puck
            const shrinkRatio = Math.max(0.1, (len - 16) / len);
            const tx = x1 + dx * shrinkRatio;
            const ty = y1 + dy * shrinkRatio;

            // Control point perpendicular to line
            const mx = (x1 + tx) * 0.5 - dy * curvature;
            const my = (y1 + ty) * 0.5 + dx * curvature;

            ctx.save();
            ctx.strokeStyle = color;
            ctx.fillStyle = color;
            ctx.lineWidth = width;
            ctx.lineCap = 'round';
            ctx.shadowColor = color;
            ctx.shadowBlur = 6;

            if (dashed) {
                ctx.setLineDash([7, 6]);
                ctx.lineDashOffset = -visualTick * 24;
            }

            ctx.beginPath();
            ctx.moveTo(x1, y1);
            ctx.quadraticCurveTo(mx, my, tx, ty);
            ctx.stroke();

            // Tangent angle at end of quadratic curve
            const endAngle = Math.atan2(ty - my, tx - mx);
            ctx.setLineDash([]);
            const headLen = 9.5;
            ctx.beginPath();
            ctx.moveTo(tx + Math.cos(endAngle) * 3, ty + Math.sin(endAngle) * 3);
            ctx.lineTo(tx - headLen * Math.cos(endAngle - Math.PI / 6), ty - headLen * Math.sin(endAngle - Math.PI / 6));
            ctx.lineTo(tx - headLen * Math.cos(endAngle + Math.PI / 6), ty - headLen * Math.sin(endAngle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        /**
         * Draws a High-End 3D Broadcast Player Puck with directional chevron & turf highlight
         */
        function drawBroadcastPuck(x, y, r, paletteType, roleText, nameText, facingAngle, isHighlighted) {
            ctx.save();

            const palettes = {
                home: { top: '#f6d36a', mid: '#e3b53a', bot: '#7d620f', glow: '#f6d36a', text: '#14140f' },
                away: { top: '#60a5fa', mid: '#2563eb', bot: '#1e3a8a', glow: '#93c5fd', text: '#ffffff' },
                keeper: { top: '#f4f2ea', mid: '#d6d2c4', bot: '#6f6b5f', glow: '#ffffff', text: '#14140f' },
                neutral: { top: '#fef08a', mid: '#eab308', bot: '#a16207', glow: '#fde047', text: '#0f172a' }
            };
            const pal = palettes[paletteType] || palettes.home;

            // 1. Pulsing Broadcast Ring on the grass when selected or hovered
            if (isHighlighted) {
                const pulse = 0.5 + 0.5 * Math.sin(visualTick * 5);
                ctx.save();
                ctx.beginPath();
                ctx.arc(x, y + 1, r + 5 + pulse * 3, 0, Math.PI * 2);
                ctx.strokeStyle = pal.glow;
                ctx.lineWidth = 2.2;
                ctx.shadowColor = pal.glow;
                ctx.shadowBlur = 10;
                ctx.stroke();
                ctx.restore();
            }

            // 2. Subtle Directional Vision Arc / Chevron on the grass in front of the player
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(facingAngle);
            ctx.beginPath();
            ctx.arc(0, 0, r + 3.5, -0.52, 0.52);
            ctx.strokeStyle = pal.glow;
            ctx.lineWidth = 2.4;
            ctx.lineCap = 'round';
            ctx.stroke();

            // Small chevron tip
            ctx.fillStyle = pal.glow;
            ctx.beginPath();
            ctx.moveTo(r + 7.2, 0);
            ctx.lineTo(r + 3.2, -3.2);
            ctx.lineTo(r + 3.2, 3.2);
            ctx.closePath();
            ctx.fill();
            ctx.restore();

            // 3. Soft Elliptical Ground Shadow
            ctx.fillStyle = 'rgba(0, 0, 0, 0.52)';
            ctx.beginPath();
            ctx.ellipse(x, y + r * 0.28, r * 1.02, r * 0.86, 0, 0, Math.PI * 2);
            ctx.fill();

            // 4. 3D Puck Lower Cylinder Base Rim
            ctx.fillStyle = pal.bot;
            ctx.beginPath();
            ctx.arc(x, y + 2.2, r, 0, Math.PI * 2);
            ctx.fill();

            // 5. Main Glossy Puck Body Gradient
            const grad = ctx.createRadialGradient(x - r * 0.35, y - r * 0.35, r * 0.1, x, y, r);
            grad.addColorStop(0, pal.top);
            grad.addColorStop(0.55, pal.mid);
            grad.addColorStop(1, pal.bot);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();

            // Crisp Metallic/White Rim
            ctx.lineWidth = 1.8;
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.92)';
            ctx.stroke();

            // Top Specular Sheen
            ctx.beginPath();
            ctx.arc(x, y, r * 0.82, -Math.PI * 0.85, -Math.PI * 0.15);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.35)';
            ctx.lineWidth = 1.2;
            ctx.stroke();

            // 6. Crisp Role / Number Text
            ctx.fillStyle = pal.text;
            ctx.font = `800 ${Math.round(r * 0.70)}px Inter, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(roleText, x, y + 0.5);

            // 7. Floating Glass Name Pill Underneath
            if (showPlayerNames && nameText) {
                const fontSize = Math.max(8.5, Math.round(r * 0.54));
                ctx.font = `600 ${fontSize}px Inter, sans-serif`;
                const textW = ctx.measureText(nameText).width;
                const boxW = textW + 10;
                const boxH = fontSize + 5;
                const boxX = x - boxW / 2;
                const boxY = y + r + 4.5;

                ctx.fillStyle = 'rgba(9, 13, 22, 0.78)';
                ctx.beginPath();
                ctx.roundRect(boxX, boxY, boxW, boxH, 5);
                ctx.fill();

                ctx.strokeStyle = 'rgba(255, 255, 255, 0.12)';
                ctx.lineWidth = 0.8;
                ctx.stroke();

                ctx.fillStyle = '#f1f5f9';
                ctx.fillText(nameText, x, boxY + boxH / 2 + 0.5);
            }

            ctx.restore();
        }

        /**
         * Draws a realistic rotating football with 3D height elevation & separated ground shadow
         */
        function drawBroadcastFootball(x, y, baseR, elevation = 0, travelDist = 0) {
            ctx.save();

            const liftPx = elevation * 34;
            const r = baseR * (1 + elevation * 0.28);
            const ballY = y - liftPx;

            // 1. Ground Shadow on the grass (separates and softens when ball is in the air!)
            const shadowScale = Math.max(0.55, 1 - elevation * 0.35);
            const shadowAlpha = Math.max(0.22, 0.62 - elevation * 0.32);
            ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
            ctx.beginPath();
            ctx.ellipse(x + elevation * 6, y + 3, baseR * shadowScale * 1.05, baseR * shadowScale * 0.75, 0, 0, Math.PI * 2);
            ctx.fill();

            // 2. 3D Spherical Ball Body
            const sphereGrad = ctx.createRadialGradient(x - r * 0.3, ballY - r * 0.3, r * 0.1, x, ballY, r);
            sphereGrad.addColorStop(0, '#ffffff');
            sphereGrad.addColorStop(0.7, '#f1f5f9');
            sphereGrad.addColorStop(1, '#94a3b8');

            ctx.beginPath();
            ctx.arc(x, ballY, r, 0, Math.PI * 2);
            ctx.fillStyle = sphereGrad;
            ctx.fill();
            ctx.lineWidth = 1.4;
            ctx.strokeStyle = '#0f172a';
            ctx.stroke();

            // 3. Rotating Pentagon/Hexagon Seam Pattern
            ctx.save();
            ctx.beginPath();
            ctx.arc(x, ballY, r - 0.8, 0, Math.PI * 2);
            ctx.clip();

            const spinAngle = travelDist * 18 + (isPlaying ? visualTick * 2.2 : 0);
            ctx.translate(x, ballY);
            ctx.rotate(spinAngle);

            // Center dark panel
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            for (let i = 0; i < 5; i++) {
                const a = (i * Math.PI * 2) / 5;
                const px = Math.cos(a) * r * 0.38;
                const py = Math.sin(a) * r * 0.38;
                if (i === 0) ctx.moveTo(px, py);
                else ctx.lineTo(px, py);
            }
            ctx.closePath();
            ctx.fill();

            // Seam spokes & outer pentagon patches
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < 5; i++) {
                const a = (i * Math.PI * 2) / 5;
                ctx.beginPath();
                ctx.moveTo(Math.cos(a) * r * 0.34, Math.sin(a) * r * 0.34);
                ctx.lineTo(Math.cos(a) * r * 0.88, Math.sin(a) * r * 0.88);
                ctx.stroke();

                ctx.fillStyle = '#0f172a';
                ctx.beginPath();
                ctx.arc(Math.cos(a) * r * 0.95, Math.sin(a) * r * 0.95, r * 0.24, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Subtle golden broadcast tracking halo around ball
            ctx.beginPath();
            ctx.arc(x, ballY, r + 2.2, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(250, 204, 21, 0.65)';
            ctx.lineWidth = 1.3;
            ctx.stroke();

            ctx.restore();
        }

        /**************************************************************************
         * 6. 60 FPS ANIMATION LOOP & TIMELINE CONTROLS
         **************************************************************************/
        function animationLoop(now) {
            const dt = Math.min(0.05, (now - lastFrameTime) / 1000);
            lastFrameTime = now;
            visualTick += dt;

            if (isPlaying && activeData) {
                const phases = activeData.phases;
                if (pauseHoldTimer > 0) {
                    pauseHoldTimer -= dt * playbackSpeed;
                } else {
                    phaseProgress += (dt * playbackSpeed) / 1.95;

                    if (phaseProgress >= 1.0) {
                        phaseProgress = 0;
                        if (currentPhaseIndex < phases.length - 1) {
                            currentPhaseIndex++;
                            pauseHoldTimer = 0.40;
                            updatePhaseUI();
                        } else if (loopEnabled) {
                            currentPhaseIndex = 0;
                            pauseHoldTimer = 0.50;
                            updatePhaseUI();
                        } else {
                            currentPhaseIndex = phases.length - 1;
                            isPlaying = false;
                            updatePlayButtonUI();
                            updatePhaseUI();
                        }
                    }
                }
                updateScrubberUI();
            }

            drawScene();
            requestAnimationFrame(animationLoop);
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                const phases = activeData.phases;
                if (currentPhaseIndex >= phases.length - 1 && !loopEnabled) {
                    currentPhaseIndex = 0;
                    phaseProgress = 0;
                }
                lastFrameTime = performance.now();
            }
            updatePlayButtonUI();
            updatePhaseUI();
        }

        function updatePlayButtonUI() {
            const icon = document.getElementById('iconPlayPause');
            const focusIcon = document.getElementById('focusPlayIcon');
            const text = document.getElementById('textPlayPause');
            if (isPlaying) {
                icon.className = 'fa-solid fa-pause text-xs';
                focusIcon.className = 'fa-solid fa-pause text-orange-400';
                text.textContent = 'Pauze';
            } else {
                icon.className = 'fa-solid fa-play text-xs';
                focusIcon.className = 'fa-solid fa-play text-orange-400';
                text.textContent = 'Afspelen';
            }
        }

        function goToPhase(idx) {
            if (!activeData) return;
            isPlaying = false;
            updatePlayButtonUI();
            currentPhaseIndex = Math.max(0, Math.min(activeData.phases.length - 1, idx));
            phaseProgress = 0;
            updatePhaseUI();
            updateScrubberUI();
        }

        function prevPhase() {
            if (!activeData) return;
            goToPhase((currentPhaseIndex - 1 + activeData.phases.length) % activeData.phases.length);
        }

        function nextPhase() {
            if (!activeData) return;
            goToPhase((currentPhaseIndex + 1) % activeData.phases.length);
        }

        function setSpeed(spd) {
            playbackSpeed = spd;
            document.querySelectorAll('.speed-btn').forEach(btn => {
                if (parseFloat(btn.dataset.speed) === spd) {
                    btn.className = 'speed-btn px-2 py-1 rounded-lg bg-white/15 text-white font-bold transition';
                } else {
                    btn.className = 'speed-btn px-2 py-1 rounded-lg text-slate-400 hover:text-white transition';
                }
            });
        }

        function toggleLoop() {
            loopEnabled = !loopEnabled;
            const btn = document.getElementById('btnLoop');
            btn.className = loopEnabled
                ? 'w-8 h-8 rounded-xl bg-orange-500/20 text-orange-400 border border-orange-500/40 text-xs flex items-center justify-center shrink-0 transition'
                : 'w-8 h-8 rounded-xl bg-slate-900/70 text-slate-500 border border-white/10 text-xs flex items-center justify-center shrink-0 transition';
        }

        function scrubTimeline(e) {
            if (!activeData) return;
            const track = document.getElementById('timelineTrack');
            const rect = track.getBoundingClientRect();
            const ratio = Math.max(0, Math.min(0.999, (e.clientX - rect.left) / rect.width));
            const total = activeData.phases.length;
            const exact = ratio * total;
            currentPhaseIndex = Math.floor(exact);
            phaseProgress = exact - currentPhaseIndex;
            isPlaying = false;
            updatePlayButtonUI();
            updatePhaseUI();
            updateScrubberUI();
        }

        function updateScrubberUI() {
            if (!activeData) return;
            const total = activeData.phases.length;
            const pct = ((currentPhaseIndex + phaseProgress) / total) * 100;
            document.getElementById('timelineFill').style.width = `${Math.min(100, Math.max(6, pct))}%`;
            document.getElementById('focusPhaseLabel').textContent = `Fase ${currentPhaseIndex + 1}/${total}`;
        }

        function updatePhaseUI() {
            if (!activeData) return;
            const phases = activeData.phases;
            const curr = phases[currentPhaseIndex];

            const container = document.getElementById('phasePillsContainer');
            container.innerHTML = '';
            phases.forEach((p, idx) => {
                const btn = document.createElement('button');
                const active = idx === currentPhaseIndex;
                btn.className = active
                    ? 'flex items-center gap-1.5 px-2.5 py-0.5 rounded-lg text-[11px] font-bold bg-orange-500/25 text-orange-300 border border-orange-500/50 transition'
                    : 'flex items-center gap-1.5 px-2 py-0.5 rounded-lg text-[11px] font-medium text-slate-400 hover:text-white transition';
                btn.innerHTML = `<span class="w-2 h-2 rounded-full ${active ? 'bg-orange-400 shadow-[0_0_8px_#fb923c]' : 'bg-slate-600'}"></span><span>Fase ${idx + 1}</span>`;
                btn.onclick = () => goToPhase(idx);
                container.appendChild(btn);
            });

            document.getElementById('coachStepBadge').textContent = `FASE ${currentPhaseIndex + 1} / ${phases.length}`;
            document.getElementById('coachStepTitle').textContent = curr.title;
            document.getElementById('coachStepDesc').textContent = curr.desc;
            document.getElementById('coachStepTip').textContent = curr.tip;
            document.getElementById('focusPhaseLabel').textContent = `Fase ${currentPhaseIndex + 1}/${phases.length}`;

            const delBtn = document.getElementById('btnDeletePhase');
            delBtn.disabled = phases.length <= 1;
            delBtn.style.opacity = phases.length <= 1 ? '0.35' : '1';
        }

        /**************************************************************************
         * 7. POINTER INTERACTION (DRAGGING, HOVERING & CURVED DRAWING)
         **************************************************************************/
        function getPointerPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function findEntityAtCanvasPos(cx, cy) {
            if (!activeData) return null;
            const state = getInterpolatedState();
            const r = getPlayerTokenRadius() + 6;

            const bPos = logicalToCanvas(state.ball.x, state.ball.y);
            if (Math.hypot(cx - bPos.x, cy - bPos.y) <= r * 0.9) {
                return { type: 'ball', index: 0 };
            }

            for (let i = state.home.length - 1; i >= 0; i--) {
                const p = logicalToCanvas(state.home[i].x, state.home[i].y);
                if (Math.hypot(cx - p.x, cy - p.y) <= r) return { type: 'home', index: i };
            }

            for (let i = state.neutral.length - 1; i >= 0; i--) {
                const p = logicalToCanvas(state.neutral[i].x, state.neutral[i].y);
                if (Math.hypot(cx - p.x, cy - p.y) <= r) return { type: 'neutral', index: i };
            }

            if (showOpponents) {
                for (let i = state.away.length - 1; i >= 0; i--) {
                    const p = logicalToCanvas(state.away[i].x, state.away[i].y);
                    if (Math.hypot(cx - p.x, cy - p.y) <= r) return { type: 'away', index: i };
                }
            }
            return null;
        }

        canvas.addEventListener('pointerdown', (e) => {
            const pos = getPointerPos(e);

            if (activeTool !== 'move') {
                isDrawing = true;
                const lPos = canvasToLogical(pos.x, pos.y);
                currentDrawing = { type: activeTool, x1: lPos.x, y1: lPos.y, x2: lPos.x, y2: lPos.y };
                return;
            }

            const hit = findEntityAtCanvasPos(pos.x, pos.y);
            if (hit) {
                if (isPlaying) {
                    isPlaying = false;
                    updatePlayButtonUI();
                }
                if (phaseProgress > 0.01) {
                    const snap = getInterpolatedState();
                    const curr = activeData.phases[currentPhaseIndex];
                    curr.ball = { ...snap.ball, arc: curr.ball.arc || 0 };
                    curr.home = snap.home;
                    curr.away = snap.away;
                    curr.neutral = snap.neutral;
                    phaseProgress = 0;
                    updateScrubberUI();
                }

                draggingEntity = hit;
                if (hit.type !== 'ball') {
                    const now = performance.now();
                    selectPlayerForEditing(hit.type, hit.index, now - lastClickTime < 350);
                    lastClickTime = now;
                }
                canvas.setPointerCapture(e.pointerId);
            } else {
                closePlayerPopover();
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            const pos = getPointerPos(e);

            if (isDrawing && currentDrawing) {
                const lPos = canvasToLogical(pos.x, pos.y);
                currentDrawing.x2 = lPos.x;
                currentDrawing.y2 = lPos.y;
                return;
            }

            if (draggingEntity && activeData) {
                const lPos = canvasToLogical(pos.x, pos.y);
                const currPhase = activeData.phases[currentPhaseIndex];
                if (draggingEntity.type === 'ball') {
                    currPhase.ball.x = lPos.x;
                    currPhase.ball.y = lPos.y;
                } else if (draggingEntity.type === 'home') {
                    currPhase.home[draggingEntity.index] = { x: lPos.x, y: lPos.y };
                } else if (draggingEntity.type === 'away') {
                    currPhase.away[draggingEntity.index] = { x: lPos.x, y: lPos.y };
                } else if (draggingEntity.type === 'neutral') {
                    currPhase.neutral[draggingEntity.index] = { x: lPos.x, y: lPos.y };
                }
                return;
            }

            hoveredEntity = activeTool === 'move' ? findEntityAtCanvasPos(pos.x, pos.y) : null;
        });

        window.addEventListener('pointerup', () => {
            if (isDrawing && currentDrawing) {
                const dist = Math.hypot(currentDrawing.x2 - currentDrawing.x1, currentDrawing.y2 - currentDrawing.y1);
                if (dist > 0.02) customDrawings.push(currentDrawing);
                currentDrawing = null;
                isDrawing = false;
            }
            draggingEntity = null;
        });

        function selectPlayerForEditing(team, index, showPopover = false) {
            selectedPlayer = { team, index };
            const list = team === 'home'
                ? activeData.homePlayers
                : (team === 'away' ? activeData.awayPlayers : activeData.neutralPlayers);
            const playerObj = list[index];
            if (!playerObj) return;

            document.getElementById('selPlayerTeamBadge').textContent = team === 'home'
                ? `Oranje • Speler #${index + 1}`
                : (team === 'away' ? `Blauw • Speler #${index + 1}` : `Neutraal #${index + 1}`);

            document.getElementById('inputPlayerRole').value = playerObj.role;
            document.getElementById('inputPlayerName').value = playerObj.name;

            if (showPopover) {
                document.getElementById('playerPopover').classList.remove('hidden');
            }
        }

        function closePlayerPopover() {
            document.getElementById('playerPopover').classList.add('hidden');
        }

        function savePlayerEdit() {
            if (!selectedPlayer || !activeData) return;
            const list = selectedPlayer.team === 'home'
                ? activeData.homePlayers
                : (selectedPlayer.team === 'away' ? activeData.awayPlayers : activeData.neutralPlayers);
            const playerObj = list[selectedPlayer.index];
            if (!playerObj) return;

            playerObj.role = document.getElementById('inputPlayerRole').value.toUpperCase() || 'S';
            playerObj.name = document.getElementById('inputPlayerName').value;
        }

        /**************************************************************************
         * 8. UI CONTROLS: FORMATS, SCENARIOS, ICON TOGGLES & FOCUS MODE
         **************************************************************************/
        function selectFormat(fmt) {
            currentFormat = fmt;
            currentSubFormation = 0;

            document.querySelectorAll('.format-tab').forEach(btn => {
                if (btn.dataset.format === fmt) btn.classList.add('format-pill-active');
                else btn.classList.remove('format-pill-active');
            });

            const badgeLabels = {
                '4v4': '4v4 • JO7 Mini-veld',
                '6v6': '6v6 • JO8-JO10',
                '8v8': '8v8 • JO11-JO12',
                '11v11': '11v11 • Heel Veld',
                'training': 'Rondo & Positiespel'
            };
            document.getElementById('activeFormatBadge').textContent = badgeLabels[fmt] || fmt;

            updateSubFormationSelector();
            loadScenarioData();
            resizeCanvas();
        }

        function selectScenario(scen) {
            currentScenario = scen;
            document.querySelectorAll('.scenario-btn').forEach(btn => {
                if (btn.dataset.scenario === scen) btn.classList.add('scenario-pill-active');
                else btn.classList.remove('scenario-pill-active');
            });

            updateSubFormationSelector();
            loadScenarioData();
        }

        function updateSubFormationSelector() {
            const select = document.getElementById('formationSelect');
            const options = SUB_FORMATIONS[currentFormat] || [];
            select.innerHTML = '';
            options.forEach((opt, idx) => {
                const el = document.createElement('option');
                el.value = idx;
                el.textContent = opt.name;
                if (idx === currentSubFormation) el.selected = true;
                select.appendChild(el);
            });
        }

        function changeSubFormation(idxStr) {
            currentSubFormation = parseInt(idxStr, 10) || 0;
            loadScenarioData();
        }

        function loadScenarioData() {
            isPlaying = false;
            updatePlayButtonUI();
            currentPhaseIndex = 0;
            phaseProgress = 0;
            customDrawings = [];
            activeData = buildScenarioData(currentFormat, currentScenario, currentSubFormation);
            selectedPlayer = { team: 'home', index: 0 };
            updatePhaseUI();
            updateScrubberUI();
        }

        function resetCurrentScenario() {
            loadScenarioData();
        }

        function addCustomPhase() {
            if (!activeData) return;
            const curr = activeData.phases[currentPhaseIndex];
            const clonePhase = {
                title: `Fase ${activeData.phases.length + 1}: Vervolgactie`,
                desc: 'Versleep de spelers en de bal naar hun nieuwe positie en klik op Afspelen.',
                tip: '"Pas deze tekst aan met het potlood-icoontje."',
                ball: { x: curr.ball.x, y: curr.ball.y, arc: 0 },
                home: curr.home.map(p => ({ x: p.x, y: p.y })),
                away: curr.away.map(p => ({ x: p.x, y: p.y })),
                neutral: (curr.neutral || []).map(p => ({ x: p.x, y: p.y })),
                triangles: curr.triangles ? [...curr.triangles] : []
            };
            activeData.phases.splice(currentPhaseIndex + 1, 0, clonePhase);
            goToPhase(currentPhaseIndex + 1);
        }

        function deleteCurrentPhase() {
            if (!activeData || activeData.phases.length <= 1) return;
            activeData.phases.splice(currentPhaseIndex, 1);
            if (currentPhaseIndex >= activeData.phases.length) {
                currentPhaseIndex = activeData.phases.length - 1;
            }
            goToPhase(currentPhaseIndex);
        }

        function setInteractionTool(tool) {
            activeTool = tool;
            document.querySelectorAll('.tool-btn').forEach(btn => btn.classList.remove('tool-pill-active'));
            const map = { move: 'toolMove', pass: 'toolPass', run: 'toolRun', zone: 'toolZone' };
            const el = document.getElementById(map[tool]);
            if (el) el.classList.add('tool-pill-active');
            canvas.style.cursor = tool === 'move' ? 'grab' : 'crosshair';
        }

        function clearDrawings() {
            customDrawings = [];
            currentDrawing = null;
        }

        function toggleVisualOption(opt) {
            if (opt === 'paths') {
                showPaths = !showPaths;
                document.getElementById('btnTogglePaths').classList.toggle('icon-toggle-active', showPaths);
            } else if (opt === 'triangles') {
                showTriangles = !showTriangles;
                document.getElementById('btnToggleTriangles').classList.toggle('icon-toggle-active', showTriangles);
            } else if (opt === 'names') {
                showPlayerNames = !showPlayerNames;
                document.getElementById('btnToggleNames').classList.toggle('icon-toggle-active', showPlayerNames);
            } else if (opt === 'opponents') {
                showOpponents = !showOpponents;
                document.getElementById('btnToggleOpponents').classList.toggle('icon-toggle-active', showOpponents);
            }
        }

        function toggleOrientation() {
            isVertical = !isVertical;
            resizeCanvas();
        }

        function toggleFocusMode() {
            isFocusMode = !isFocusMode;
            document.body.classList.toggle('focus-mode', isFocusMode);
            const exitBar = document.getElementById('focusExitBar');
            if (isFocusMode) {
                exitBar.classList.remove('hidden');
                exitBar.classList.add('flex');
            } else {
                exitBar.classList.add('hidden');
                exitBar.classList.remove('flex');
            }
            setTimeout(resizeCanvas, 60);
        }

        function toggleCoachCardCollapse() {
            isCoachCardCollapsed = !isCoachCardCollapsed;
            const body = document.getElementById('coachCardBody');
            const icon = document.getElementById('coachCollapseIcon');
            if (isCoachCardCollapsed) {
                body.classList.add('hidden');
                icon.className = 'fa-solid fa-chevron-up text-xs';
            } else {
                body.classList.remove('hidden');
                icon.className = 'fa-solid fa-chevron-down text-xs';
            }
        }

        function openEditPhaseTextModal() {
            if (!activeData) return;
            const curr = activeData.phases[currentPhaseIndex];
            document.getElementById('modalPhaseTitle').value = curr.title;
            document.getElementById('modalPhaseDesc').value = curr.desc;
            document.getElementById('modalPhaseTip').value = curr.tip;
            const modal = document.getElementById('editPhaseModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function closeEditPhaseTextModal() {
            const modal = document.getElementById('editPhaseModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        }

        function saveEditPhaseTextModal() {
            if (!activeData) return;
            const curr = activeData.phases[currentPhaseIndex];
            curr.title = document.getElementById('modalPhaseTitle').value || `Fase ${currentPhaseIndex + 1}`;
            curr.desc = document.getElementById('modalPhaseDesc').value || '';
            curr.tip = document.getElementById('modalPhaseTip').value || '';
            closeEditPhaseTextModal();
            updatePhaseUI();
        }

        /**************************************************************************
         * 9. INITIALIZATION
         **************************************************************************/
        window.addEventListener('resize', resizeCanvas);

        window.onload = function () {
            createGrassNoisePattern();
            updateSubFormationSelector();
            loadScenarioData();
            resizeCanvas();
            requestAnimationFrame(animationLoop);
        };
    </script>
<!-- VFC Teamplanner: teammodus (eigen spelers, rustige standaard, presenteren, afbeelding opslaan) -->

<div id="vfcBar" style="display:none"></div>
<script>
(function(){
  let T = null;
  try{ const h = decodeURIComponent((location.hash || '').replace(/^#d=/, '')); if(h) T = JSON.parse(h); }catch(e){}
  if(!T || !T.players) return;
  let labelMode = T.label || 'beide';
  const fmt = T.fmt || '6v6';
  function rolesAndCoords(){
    const base = (SUB_FORMATIONS[fmt] || [])[0];
    const awayRoles = (base ? base.roles : []).map(r => [r[0], r[1]]);
    let slots = (T.lineup && T.lineup.length) ? T.lineup : null;
    if(!slots){
      /* geen opstelling: neem de basisformatie van het bord en vul de spelers in volgorde in, keeper eerst */
      const tmp = buildScenarioData(fmt, 'formatie', 0), n = tmp.homePlayers.length;
      const ps = T.players.slice(); const ki = ps.findIndex(p => p.keeper || (p.pos || []).includes('K'));
      if(ki > 0) ps.unshift(ps.splice(ki, 1)[0]);
      slots = tmp.homePlayers.map((hp, i) => ({role:hp.role, x:tmp.phases[0].home[i].x, y:tmp.phases[0].home[i].y, p:ps[i] || null})).slice(0, n);
    }
    const homeRoles = slots.map(s => {
      const p = s.p, num = p && p.num ? String(p.num) : '', nm = p ? p.name : '';
      if(labelMode === 'nr') return [num || s.role, ''];
      if(labelMode === 'naam') return [s.role, nm || s.role];
      return [num || s.role, nm];
    });
    while(awayRoles.length < homeRoles.length) awayRoles.push(['', '']);
    return {homeRoles, awayRoles:awayRoles.slice(0, homeRoles.length), coords:slots.map(s => [s.x, s.y])};
  }
  function loadTeam(){
    const r = rolesAndCoords();
    isPlaying = false; updatePlayButtonUI(); currentPhaseIndex = 0; phaseProgress = 0; customDrawings = [];
    activeData = buildFormationMovementScenario(r.homeRoles, r.awayRoles, r.coords, T.formName || 'jullie opstelling');
    activeData.phases[0].title = 'Opstelling ' + (T.team || '') + (T.match ? ' · ' + T.match : '');
    activeData.phases[0].desc = 'Versleep spelers en bal, teken passes en looplijnen, of speel de fases af.';
    activeData.phases[0].tip = '';
    showPlayerNames = labelMode !== 'nr';
    selectedPlayer = null; updatePhaseUI(); updateScrubberUI();
  }
  function bar(){
    const el = document.getElementById('vfcBar'); el.style.display = 'flex';
    el.innerHTML = '<b>' + (T.team || 'Mijn team') + '</b>' +
      [['nr','Nr'],['naam','Naam'],['beide','Nr + naam']].map(([v,l]) => '<button data-l="' + v + '" class="' + (labelMode === v ? 'on' : '') + '">' + l + '</button>').join('') +
      '<span class="sep"></span><button data-a="team">Mijn opstelling</button><button data-a="pres">Presenteren</button><button data-a="png">Afbeelding opslaan</button><span class="sep"></span><button data-a="more" class="' + (document.body.classList.contains('vfc-calm') ? '' : 'on') + '">' + (document.body.classList.contains('vfc-calm') ? 'Meer opties' : 'Minder opties') + '</button>';
  }
  document.addEventListener('click', e => {
    const b = e.target.closest('#vfcBar button'); if(!b) return;
    if(b.dataset.l){ labelMode = b.dataset.l; loadTeam(); bar(); }
    else if(b.dataset.a === 'team'){ if(currentFormat !== fmt) selectFormat(fmt); loadTeam(); }
    else if(b.dataset.a === 'pres'){
      const on = !document.fullscreenElement;
      if(on && document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => {});
      if(!on && document.exitFullscreen) document.exitFullscreen().catch(() => {});
      if(isFocusMode !== on) toggleFocusMode();
    }
    else if(b.dataset.a === 'more'){
      /* in het dashboard (klein venster) openen we de uitgebreide versie in een eigen venster */
      if(window.top !== window && document.body.classList.contains('vfc-calm')){ window.open(location.href.split('#')[0].replace(/[?&]meer=1/, '') + (location.search ? '&' : '?') + 'meer=1' + location.hash, '_blank', 'noopener'); return; }
      document.body.classList.toggle('vfc-calm'); bar(); setTimeout(resizeCanvas, 60);
    }
    else if(b.dataset.a === 'png'){
      const a = document.createElement('a'); a.download = ((T.team || 'opstelling') + '.png').replace(/[^\w.\- ]+/g, ''); a.href = canvas.toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove();
    }
  });
  document.addEventListener('fullscreenchange', () => { if(!document.fullscreenElement && isFocusMode) toggleFocusMode(); });
  const prev = window.onload;
  window.onload = function(){
    /* rustige start: geen driehoeken, tegenstanders en looplijnen */
    showTriangles = false; showOpponents = false; showPaths = false;
    ['btnToggleTriangles','btnToggleOpponents','btnTogglePaths'].forEach(id => { const x = document.getElementById(id); if(x) x.classList.remove('icon-toggle-active'); });
    if(!/[?&]meer=1/.test(location.search)) document.body.classList.add('vfc-calm');
    if(prev) prev();
    currentScenario = 'formatie';
    document.querySelectorAll('.scenario-btn').forEach(btn => btn.classList.toggle('scenario-pill-active', btn.dataset.scenario === 'formatie'));
    selectFormat(fmt);
    loadTeam(); resizeCanvas(); bar();
    if(typeof toggleCoachCardCollapse === 'function' && !isCoachCardCollapsed) toggleCoachCardCollapse();
  };
})();
</script>
